name: Build YOLO Camera APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            libltdl-dev wget
          
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython
          
      - name: Setup Android SDK cmdline-tools
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p $SDK_DIR/cmdline-tools
          
          if [ ! -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            cd /tmp
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q commandlinetools-linux-11076708_latest.zip
            mkdir -p $SDK_DIR/cmdline-tools/latest
            mv cmdline-tools/* $SDK_DIR/cmdline-tools/latest/
            rm -rf cmdline-tools commandlinetools-linux-11076708_latest.zip
          fi
          
          mkdir -p $SDK_DIR/tools/bin
          ln -sf $SDK_DIR/cmdline-tools/latest/bin/sdkmanager $SDK_DIR/tools/bin/sdkmanager
          
          mkdir -p $SDK_DIR/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $SDK_DIR/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK_DIR/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $SDK_DIR/licenses/android-sdk-preview-license
          
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          export PATH=$SDK_DIR/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          yes | sdkmanager "platform-tools" "build-tools;33.0.0" "platforms;android-33" || true
          
      - name: Build APK
        run: |
          buildozer -v android debug
        timeout-minutes: 180
        env:
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yolo-camera-apk
          path: bin/*.apk
          if-no-files-found: warn
